# Application Configuration
spring.application.name=journal-intime

# DataSource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/journal_intime
spring.datasource.username=journal_user
spring.datasource.password=journal_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Envers (Audit)
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_audit
spring.jpa.properties.org.hibernate.envers.revision_field_name=revision_id
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revision_type

# Hibernate Search / Lucene
spring.jpa.properties.hibernate.search.backend.type=lucene
spring.jpa.properties.hibernate.search.backend.directory.type=local-filesystem
spring.jpa.properties.hibernate.search.backend.directory.root=./data/lucene/indexes

# Security
app.encryption.key=

# Logging
logging.level.root=INFO
logging.level.com.journalintime=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server (not needed for desktop app, but kept for potential REST API)
server.port=8080
